<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Blood Requests - BloodLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0f19; color: #fff; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(18, 24, 38, 0.95); border-bottom: 1px solid rgba(239, 68, 68, 0.3); }
        .logo { font-size: 24px; font-weight: 700; color: #ef4444; }
        nav { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        nav a { color: #f1f5f9; text-decoration: none; font-weight: 500; transition: 0.3s; font-size: 15px; }
        nav a:hover, nav a.active { color: #ef4444; }
        .logout-btn { background: #ef4444; border: none; color: white; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .logout-btn:hover { background: #dc2626; }
        .login-nav-btn { background: linear-gradient(135deg, #dc2626, #ef4444); padding: 8px 20px; border-radius: 6px; color: white !important; font-weight: 600; }
        
        .container { padding: 40px 8%; max-width: 1400px; margin: 0 auto; }
        h2 { text-align: center; color: #ef4444; margin-bottom: 20px; font-size: 32px; }
        
        .filter-tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .tab-btn { background: #121826; color: #cbd5e1; border: 1px solid #334155; padding: 10px 22px; border-radius: 6px; cursor: pointer; font-weight: 500; transition: 0.3s; }
        .tab-btn.active { background: #ef4444; color: white; border-color: #ef4444; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
        .card { background: #121826; border: 1px solid #1e293b; border-left: 4px solid #ef4444; padding: 24px; border-radius: 12px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: all 0.3s ease; }
        .card h3 { color: #ef4444; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; }
        .badge { background: #dc2626; color: white; padding: 4px 10px; font-size: 12px; border-radius: 4px; font-weight: 600; }
        .badge-pending { background: #eab308; color: #000; }
        .card p { color: #cbd5e1; font-size: 14px; margin: 6px 0; }
        
        .update-box { margin-top: 18px; padding-top: 14px; border-top: 1px solid #1e293b; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
        .update-box input { width: 90px; padding: 8px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; text-align: center; font-weight: 600; }
        .update-btn { background: #16a34a; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .update-btn:hover { background: #15803d; }
        .no-data { text-align: center; color: #64748b; grid-column: 1/-1; font-size: 18px; padding: 40px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🩸 BloodLink</div>
        <nav id="navbar">
            <!-- Dynamic Navigation injected via script based on login state -->
        </nav>
    </header>

    <div class="container">
        <h2>Emergency Blood Requests & Pending Status</h2>
        
        <div class="filter-tabs">
            <button class="tab-btn active" id="allBtn" onclick="switchTab('all')">All Active Requests</button>
            <button class="tab-btn" id="myBtn" onclick="switchTab('my')">My Requests</button>
        </div>

        <div id="requestsContainer" class="grid"></div>
    </div>

    <script>
        let currentMode = 'all';
        const loggedDonor = JSON.parse(localStorage.getItem('loggedDonor'));

        // Render Navbar dynamically based on whether user is logged in
        const navbar = document.getElementById('navbar');
        if (loggedDonor && loggedDonor.phone) {
            navbar.innerHTML = `
                <a href="user_home.html">Home</a>
                <a href="find_a_donor.html">Find a Donor</a>
                <a href="blood_requests.html" class="active">Blood Requests</a>
                <a href="request_blood.html">Request Blood</a>
                <a href="dashboard.html">Dashboard</a>
                <button class="logout-btn" onclick="logout()">Logout</button>
            `;
        } else {
            navbar.innerHTML = `
                <a href="index.html">Home</a>
                <a href="find_a_donor.html">Find a Donor</a>
                <a href="blood_requests.html" class="active">Blood Requests</a>
                <a href="donor_register.html">Register</a>
                <a href="login.html" class="login-nav-btn">Login</a>
            `;
        }

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('allBtn').classList.toggle('active', mode === 'all');
            document.getElementById('myBtn').classList.toggle('active', mode === 'my');
            fetchRequests();
        }

        async function fetchRequests() {
            try {
                let url = '/api/blood-requests';
                if (currentMode === 'my') {
                    if (!loggedDonor || !loggedDonor.phone) {
                        alert("Please login first to view your requests!");
                        window.location.href = 'login.html';
                        return;
                    }
                    url = `/api/my-blood-requests/${loggedDonor.phone}`;
                }

                const res = await fetch(url);
                const requests = await res.json();
                const container = document.getElementById('requestsContainer');
                container.innerHTML = "";

                if (requests.length === 0) {
                    container.innerHTML = "<p class='no-data'>No active blood requests found right now.</p>";
                    return;
                }

                requests.forEach(req => {
                    const isPending = req.bagsCollected < req.bagsNeeded;
                    container.innerHTML += `
                        <div class="card" id="card_${req._id}">
                            <h3>${req.bloodgroup} <span class="badge ${isPending ? 'badge-pending' : ''}">${isPending ? 'Pending Update' : 'Fulfilled'}</span></h3>
                            <p><strong>Urgency:</strong> <span style="color:#ef4444; font-weight:600;">${req.urgency}</span></p>
                            <p><strong>Bags Needed:</strong> ${req.bagsNeeded} | <strong>Collected:</strong> <span style="color:#22c55e; font-weight:bold;">${req.bagsCollected}</span></p>
                            <p><strong>Hospital:</strong> ${req.hospital} (${req.department || 'N/A'})</p>
                            <p><strong>Location:</strong> ${req.location}</p>
                            <p><strong>Contact:</strong> ${req.contactPerson} (<a href="tel:${req.phone}" style="color:#ef4444; font-weight:600;">${req.phone}</a>)</p>
                            <p><strong>Clinical Summary:</strong> ${req.clinicalSummary}</p>
                            
                            <div class="update-box">
                                <span style="font-size:13px; color:#94a3b8;">Update Collected:</span>
                                <input type="number" id="collected_${req._id}" value="${req.bagsCollected}" min="0" max="${req.bagsNeeded}">
                                <button class="update-btn" onclick="updateFulfillment('${req._id}')">Save Status</button>
                            </div>
                        </div>
                    `;
                });

                // Auto-highlight and scroll if highlight param exists in URL
                const urlParams = new URLSearchParams(window.location.search);
                const highlightId = urlParams.get('highlight');
                if (highlightId) {
                    setTimeout(() => {
                        const targetCard = document.getElementById(`card_${highlightId}`);
                        if (targetCard) {
                            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            targetCard.style.border = '2px solid #ef4444';
                            targetCard.style.boxShadow = '0 0 25px rgba(239, 68, 68, 0.8)';
                        }
                    }, 400);
                }

            } catch (err) {
                console.error("Error fetching requests:", err);
            }
        }

        async function updateFulfillment(id) {
            const bagsCollected = document.getElementById(`collected_${id}`).value;
            try {
                const res = await fetch(`/api/update-request/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bagsCollected })
                });
                const data = await res.json();
                if (res.ok) {
                    alert("Request fulfillment status updated successfully!");
                    fetchRequests();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                console.error("Error updating:", err);
            }
        }

        function logout() {
            localStorage.removeItem('loggedDonor');
            window.location.href = 'index.html';
        }

        fetchRequests();
    </script>
</body>
</html>
