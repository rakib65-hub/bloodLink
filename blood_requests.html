<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Blood Requests - BloodLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0f19; color: #fff; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(18, 24, 38, 0.95); border-bottom: 1px solid rgba(239, 68, 68, 0.3); }
        .logo { font-size: 24px; font-weight: 700; color: #ef4444; }
        nav { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        nav a { color: #f1f5f9; text-decoration: none; font-weight: 500; font-size: 15px; }
        nav a:hover, nav a.active { color: #ef4444; }
        .logout-btn { background: #ef4444; border: none; color: white; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .container { padding: 40px 8%; max-width: 1200px; margin: 0 auto; }
        h2 { font-size: 28px; color: #ef4444; margin-bottom: 25px; }
        .request-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .request-card { background: #121826; border: 1px solid #1e293b; border-left: 5px solid #ef4444; padding: 20px; border-radius: 10px; transition: 0.3s; }
        .request-card h4 { color: #ef4444; font-size: 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .request-card p { color: #cbd5e1; font-size: 14px; margin: 6px 0; }
        .badge-pending { background: rgba(234, 179, 8, 0.15); color: #eab308; padding: 3px 8px; font-size: 12px; border-radius: 4px; border: 1px solid rgba(234, 179, 8, 0.3); }
        .update-box { margin-top: 15px; padding-top: 12px; border-top: 1px solid #1e293b; display: flex; gap: 10px; align-items: center; }
        .update-box input { background: #0b0f19; border: 1px solid #334155; color: #fff; padding: 6px 10px; border-radius: 6px; width: 80px; }
        .update-btn { background: #22c55e; color: #000; border: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .no-data { text-align: center; color: #64748b; font-size: 16px; grid-column: 1/-1; }
    </style>
</head>
<body>
    <script>
        const loggedUser = JSON.parse(localStorage.getItem('loggedDonor'));
        if (!loggedUser) {
            alert("Doya kore prothome login korun!");
            window.location.href = 'login.html';
        }
    </script>

    <header>
        <div class="logo">🩸 BloodLink</div>
        <nav>
            <a href="user_home.html">Home</a>
            <a href="find_a_donor.html">Find a Donor</a>
            <a href="blood_requests.html" class="active">Blood Requests</a>
            <a href="request_blood.html">Request Blood</a>
            <a href="dashboard.html">Dashboard</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </nav>
    </header>

    <div class="container">
        <h2>Active Emergency Blood Requests</h2>
        <div id="requestsContainer" class="request-grid">
            <p class="no-data">Loading requests...</p>
        </div>
    </div>

    <script>
        async function fetchRequests() {
            try {
                const res = await fetch('/api/blood-requests');
                const requests = await res.json();
                const container = document.getElementById('requestsContainer');
                
                if (requests.length === 0) {
                    container.innerHTML = "<p class='no-data'>No active blood requests found.</p>";
                    return;
                }

                container.innerHTML = "";
                requests.forEach(req => {
                    container.innerHTML += `
                        <div class="request-card" id="req_${req._id}">
                            <h4>${req.bloodgroup} <span class="badge-pending">Urgent</span></h4>
                            <p><strong>Hospital:</strong> ${req.hospital} (${req.department || 'General'})</p>
                            <p><strong>Location:</strong> ${req.location}</p>
                            <p><strong>Needed:</strong> ${req.bagsNeeded} Bags | <strong>Collected:</strong> <span style="color:#22c55e;">${req.bagsCollected || 0}</span></p>
                            <p><strong>Contact Person:</strong> ${req.contactPerson || 'N/A'} (📞 ${req.phone})</p>
                            <p><strong>Clinical Summary:</strong> ${req.clinicalSummary || 'None'}</p>
                            <div class="update-box">
                                <input type="number" id="collected_${req._id}" value="${req.bagsCollected || 0}" min="0" max="${req.bagsNeeded}">
                                <button class="update-btn" onclick="updateFulfillment('${req._id}')">Update</button>
                            </div>
                        </div>
                    `;
                });

                const urlParams = new URLSearchParams(window.location.search);
                const highlightId = urlParams.get('highlight');
                if (highlightId) {
                    setTimeout(() => {
                        const targetCard = document.getElementById(`req_${highlightId}`);
                        if (targetCard) {
                            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            targetCard.style.border = '2px solid #ef4444';
                            targetCard.style.boxShadow = '0 0 25px rgba(239, 68, 68, 0.8)';
                        }
                    }, 400);
                }
            } catch (err) { console.error(err); }
        }

        async function updateFulfillment(id) {
            const bagsCollected = document.getElementById(`collected_${id}`).value;
            try {
                const res = await fetch(`/api/update-request/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bagsCollected })
                });
                if (res.ok) {
                    alert("Updated successfully!");
                    fetchRequests();
                } else { alert("Failed to update."); }
            } catch (err) { console.error(err); }
        }

        function logout() {
            localStorage.removeItem('loggedDonor');
            window.location.href = 'login.html';
        }

        fetchRequests();
    </script>
</body>
</html>
