<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Dashboard - BloodLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0f19; color: #fff; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(18, 24, 38, 0.95); border-bottom: 1px solid rgba(239, 68, 68, 0.3); }
        .logo { font-size: 24px; font-weight: 700; color: #ef4444; }
        nav { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        nav a { color: #f1f5f9; text-decoration: none; font-weight: 500; transition: 0.3s; font-size: 15px; }
        nav a:hover, nav a.active { color: #ef4444; }
        .logout-btn { background: #ef4444; border: none; color: white; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .logout-btn:hover { background: #dc2626; }
        
        .container { max-width: 650px; margin: 40px auto; background: #121826; padding: 35px; border-radius: 12px; border: 1px solid rgba(239, 68, 68, 0.3); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .profile-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #ef4444; margin-bottom: 15px; }
        h2 { color: #ef4444; margin-bottom: 5px; font-size: 26px; }
        
        .info-group { text-align: left; background: #1e293b; padding: 20px; border-radius: 10px; margin-top: 25px; border: 1px solid #334155; }
        .info-group p { margin: 10px 0; color: #cbd5e1; font-size: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid #334155; padding-bottom: 6px; }
        .info-group span { color: #fff; font-weight: 600; }
        
        .edit-btn { background: #2563eb; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 25px; transition: 0.3s; }
        .edit-btn:hover { background: #1d4ed8; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: #121826; padding: 30px; border-radius: 12px; width: 100%; max-width: 480px; text-align: left; border: 1px solid #334155; max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { color: #ef4444; margin-bottom: 20px; text-align: center; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; outline: none; }
        .form-group input[type="file"] { padding: 8px; cursor: pointer; }
        .modal-btns { display: flex; justify-content: space-between; gap: 15px; margin-top: 25px; }
        .save-btn { background: #16a34a; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; flex: 1; }
        .cancel-btn { background: #dc2626; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; flex: 1; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🩸 BloodLink</div>
        <nav>
            <a href="user_home.html">Home</a>
            <a href="find_a_donor.html">Find a Donor</a>
            <a href="blood_requests.html">Blood Requests</a>
            <a href="request_blood.html">Request Blood</a>
            <a href="dashboard.html" class="active">Dashboard</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </nav>
    </header>

    <div class="container">
        <img id="profilePic" class="profile-img" src="https://via.placeholder.com/120" alt="Profile Picture">
        <h2 id="userName">User Name</h2>
        <p style="color: #94a3b8; font-size: 14px;">Verified BloodLink Donor</p>

        <div class="info-group">
            <p>Blood Group: <span id="userBlood">--</span></p>
            <p>Phone Number: <span id="userPhone">--</span></p>
            <p>Location: <span id="userLocation">--</span></p>
            <p>Age: <span id="userAge">--</span></p>
            <p>Gender: <span id="userGender">--</span></p>
            <p>Weight: <span id="userWeight">--</span></p>
            <p>Medical Note: <span id="userMedicalNote">--</span></p>
        </div>

        <button class="edit-btn" onclick="openEditModal()">Edit Profile</button>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>Update Profile</h3>
            <form id="editForm" onsubmit="updateProfile(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label>Profile Picture</label>
                    <input type="file" id="editPicFile" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Blood Group</label>
                    <select id="editBlood">
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="editLocation" required>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="editAge" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="editGender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Weight</label>
                    <input type="text" id="editWeight" required>
                </div>
                <div class="form-group">
                    <label>New Password (Leave blank if not changing)</label>
                    <input type="password" id="editPassword" placeholder="Enter new password">
                </div>
                <div class="form-group">
                    <label>Medical Note / Availability</label>
                    <input type="text" id="editMedicalNote">
                </div>
                <div class="modal-btns">
                    <button type="button" class="cancel-btn" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="save-btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const loggedUser = JSON.parse(localStorage.getItem('loggedDonor'));
    if (!loggedUser) {
        alert("Doya kore prothome login korun!");
        window.location.href = 'login.html';
    }
        let donorData = JSON.parse(localStorage.getItem('loggedDonor'));
        if (!donorData) {
            alert("Please login first!");
            window.location.href = 'login.html';
        } else {
            if (!donorData.fullname && donorData.name) donorData.fullname = donorData.name;
            loadUserData();
        }

        function loadUserData() {
            document.getElementById('userName').innerText = donorData.fullname || "N/A";
            document.getElementById('userBlood').innerText = donorData.bloodgroup || "N/A";
            document.getElementById('userPhone').innerText = donorData.phone || "N/A";
            document.getElementById('userLocation').innerText = donorData.location || "N/A";
            document.getElementById('userAge').innerText = donorData.age || "N/A";
            document.getElementById('userGender').innerText = donorData.gender || "N/A";
            document.getElementById('userWeight').innerText = donorData.weight || "N/A";
            document.getElementById('userMedicalNote').innerText = donorData.medicalNote || "N/A";
            if (donorData.profilePic) document.getElementById('profilePic').src = donorData.profilePic;
        }

        function openEditModal() {
            document.getElementById('editName').value = donorData.fullname || "";
            document.getElementById('editBlood').value = donorData.bloodgroup || "A+";
            document.getElementById('editLocation').value = donorData.location || "";
            document.getElementById('editAge').value = donorData.age || "";
            document.getElementById('editGender').value = donorData.gender || "Male";
            document.getElementById('editWeight').value = donorData.weight || "";
            document.getElementById('editMedicalNote').value = donorData.medicalNote || "";
            document.getElementById('editPassword').value = "";
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function updateProfile(e) {
            e.preventDefault();
            const fileInput = document.getElementById('editPicFile');
            
            const sendUpdate = async (imageBase64) => {
                const updatedData = {
                    phone: donorData.phone,
                    fullname: document.getElementById('editName').value,
                    profilePic: imageBase64 || donorData.profilePic,
                    bloodgroup: document.getElementById('editBlood').value,
                    location: document.getElementById('editLocation').value,
                    age: document.getElementById('editAge').value,
                    gender: document.getElementById('editGender').value,
                    weight: document.getElementById('editWeight').value,
                    medicalNote: document.getElementById('editMedicalNote').value,
                    password: document.getElementById('editPassword').value
                };

                try {
                    const res = await fetch('/api/update-donor', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedData)
                    });
                    const data = await res.json();
                    if (res.ok) {
                        alert("Profile updated successfully!");
                        localStorage.setItem('loggedDonor', JSON.stringify(data.donor));
                        donorData = data.donor;
                        loadUserData();
                        closeEditModal();
                    } else {
                        alert(data.message || "Failed to update profile");
                    }
                } catch (err) {
                    alert("Server connection error!");
                }
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) { sendUpdate(uploadEvent.target.result); };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                sendUpdate(null);
            }
        }

        function logout() {
            localStorage.removeItem('loggedDonor');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
