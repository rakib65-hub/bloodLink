<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Dashboard - BloodLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0f19; color: #fff; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(18, 24, 38, 0.9); border-bottom: 1px solid rgba(255, 0, 0, 0.2); }
        .logo { font-size: 24px; font-weight: 700; color: #ff3333; }
        nav { display: flex; align-items: center; gap: 25px; }
        nav a { color: #f1f5f9; text-decoration: none; font-weight: 500; transition: 0.3s; }
        nav a:hover, nav a.active { color: #ff3333; }
        .logout-btn { background: #ff3333; border: none; color: white; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .logout-btn:hover { background: #cc0000; }
        
        .container { max-width: 600px; margin: 40px auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid rgba(255, 51, 51, 0.2); text-align: center; }
        .profile-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #ff3333; margin-bottom: 15px; }
        h2 { color: #ff3333; margin-bottom: 5px; }
        
        .info-group { text-align: left; background: #121826; padding: 15px 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #334155; }
        .info-group p { margin: 8px 0; color: #cbd5e1; font-size: 15px; }
        .info-group span { color: #fff; font-weight: 600; }

        .edit-btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .edit-btn:hover { background: #2563eb; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 12px; width: 90%; max-width: 450px; text-align: left; border: 1px solid #334155; max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { color: #ff3333; margin-bottom: 15px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: #121826; border: 1px solid #334155; color: white; border-radius: 6px; outline: none; }
        .form-group input[type="file"] { padding: 8px; cursor: pointer; }
        .form-group input:focus { border-color: #ff3333; }
        .modal-btns { display: flex; justify-content: space-between; margin-top: 20px; }
        .save-btn { background: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .save-btn:hover { background: #16a34a; }
        .cancel-btn { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .cancel-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

    <header>
        <div class="logo">BloodLink🩸</div>
        <nav>
            <a href="user_home.html">Home</a>
            <a href="Find_a_donor.html">Find a Donor</a>
            <a href="Blood_requests.html">Blood Requests</a>
            <a href="Request_blood.html">Request Blood</a>
            <a href="dashboard.html" class="active" style="color: #ff3333;">Dashboard</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </nav>
    </header>

    <div class="container">
        <img id="profilePic" class="profile-img" src="https://via.placeholder.com/120" alt="Profile Picture">
        
        <h2 id="userName">User Name</h2>
        <p style="color: #94a3b8; font-size: 14px;">Donor Dashboard</p>

        <div class="info-group">
            <p><strong>Blood Group:</strong> <span id="userBlood">--</span></p>
            <p><strong>Phone Number:</strong> <span id="userPhone">--</span></p>
            <p><strong>Location:</strong> <span id="userLocation">--</span></p>
            <p><strong>Age:</strong> <span id="userAge">--</span></p>
            <p><strong>Gender:</strong> <span id="userGender">--</span></p>
            <p><strong>Weight:</strong> <span id="userWeight">--</span></p>
            <p><strong>Medical Note / Availability:</strong> <span id="userMedicalNote">--</span></p>
        </div>

        <button class="edit-btn" onclick="openEditModal()">Edit Profile</button>
    </div>

    <!-- Edit Profile Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>Update Profile</h3>
            <form id="editForm" onsubmit="updateProfile(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label>Choose Profile Picture from Device</label>
                    <input type="file" id="editPicFile" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Blood Group</label>
                    <select id="editBlood">
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="editLocation" required>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="editAge" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="editGender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Weight</label>
                    <input type="text" id="editWeight" required>
                </div>
                <div class="form-group">
                    <label>New Password (Leave blank if not changing)</label>
                    <input type="password" id="editPassword" placeholder="Enter new password">
                </div>
                <div class="form-group">
                    <label>Medical Note / Availability</label>
                    <input type="text" id="editMedicalNote">
                </div>
                <div class="modal-btns">
                    <button type="button" class="cancel-btn" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="save-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let donorData = JSON.parse(localStorage.getItem('loggedDonor'));
        
        if (!donorData) {
            alert("Please login first!");
            window.location.href = 'Login.html';
        } else {
            if (!donorData.fullname && donorData.name) {
                donorData.fullname = donorData.name;
            }
            loadUserData();
        }

        function loadUserData() {
            document.getElementById('userName').innerText = donorData.fullname || donorData.name || "N/A";
            document.getElementById('userBlood').innerText = donorData.bloodgroup || "N/A";
            document.getElementById('userPhone').innerText = donorData.phone || "N/A";
            document.getElementById('userLocation').innerText = donorData.location || "N/A";
            document.getElementById('userAge').innerText = donorData.age || "N/A";
            document.getElementById('userGender').innerText = donorData.gender || "N/A";
            document.getElementById('userWeight').innerText = donorData.weight || "N/A";
            document.getElementById('userMedicalNote').innerText = donorData.medicalNote || "N/A";
            
            if (donorData.profilePic) {
                document.getElementById('profilePic').src = donorData.profilePic;
            }
        }

        function openEditModal() {
            document.getElementById('editName').value = donorData.fullname || "";
            document.getElementById('editBlood').value = donorData.bloodgroup || "A+";
            document.getElementById('editLocation').value = donorData.location || "";
            document.getElementById('editAge').value = donorData.age || "";
            document.getElementById('editGender').value = donorData.gender || "Male";
            document.getElementById('editWeight').value = donorData.weight || "";
            document.getElementById('editMedicalNote').value = donorData.medicalNote || "";
            document.getElementById('editPassword').value = "";
            document.getElementById('editPicFile').value = ""; 
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function updateProfile(e) {
            e.preventDefault();
            const fileInput = document.getElementById('editPicFile');
            
            const sendUpdate = async (imageBase64) => {
                const updatedData = {
                    phone: donorData.phone,
                    fullname: document.getElementById('editName').value,
                    profilePic: imageBase64 || donorData.profilePic,
                    bloodgroup: document.getElementById('editBlood').value,
                    location: document.getElementById('editLocation').value,
                    age: document.getElementById('editAge').value,
                    gender: document.getElementById('editGender').value,
                    weight: document.getElementById('editWeight').value,
                    medicalNote: document.getElementById('editMedicalNote').value,
                    password: document.getElementById('editPassword').value
                };

                try {
                    const res = await fetch('http://127.0.0.1:5000/api/update-donor', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedData)
                    });
                    
                    const data = await res.json();
                    if (res.ok) {
                        alert("Profile updated successfully!");
                        localStorage.setItem('loggedDonor', JSON.stringify(data.donor));
                        donorData = data.donor;
                        loadUserData();
                        closeEditModal();
                    } else {
                        alert(data.message || "Failed to update profile");
                    }
                } catch (err) {
                    console.error(err);
                    alert("Server connection error!");
                }
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    sendUpdate(uploadEvent.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                sendUpdate(null);
            }
        }

        function logout() {
            localStorage.removeItem('loggedDonor');
            window.location.href = 'Login.html';
        }
    </script>
</body>
</html>
