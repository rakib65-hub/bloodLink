<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration - BloodLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-container { background: #121826; padding: 40px; border-radius: 12px; width: 100%; max-width: 450px; border: 1px solid rgba(255, 51, 51, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ff3333; margin-bottom: 25px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
        input, select { width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: white; outline: none; }
        input:focus, select:focus { border-color: #ff3333; }
        button { width: 100%; padding: 12px; background: #ff3333; border: none; border-radius: 6px; color: white; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #cc0000; }
        .back-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .back-link a { color: #ff3333; text-decoration: none; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Donor Registration</h2>
        <form id="registerForm">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="fullname" required placeholder="Enter your full name">
            </div>
            <div class="input-group">
                <label>Blood Group</label>
                <select id="bloodgroup" required>
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>
            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" id="phone" required placeholder="Enter phone number">
            </div>
            <div class="input-group">
                <label>Location / City</label>
                <input type="text" id="location" required placeholder="e.g. Dhaka, Uttara">
            </div>
            <div class="form-group">
    <label>Age</label>
    <input type="number" id="age" placeholder="Enter your age" required>
</div>

<div class="form-group">
    <label>Gender</label>
    <select id="gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select>
</div>

<div class="form-group">
    <label>Weight (kg)</label>
    <input type="text" id="weight" placeholder="e.g. 65 kg" required>
</div>


            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter secure password">
            </div>
            <div class="form-group">
    <label>Medical Note / Availability Preferences</label>
    <input type="text" id="medicalNote" placeholder="Any medical note or availability time">
</div>
            <button type="submit">Register Now</button>
        </form>
        <div class="back-link">
            <p>Already have an account? <a href="Login.html">Login here</a></p>
            <p style="margin-top: 5px;"><a href="index.html">← Back to Home</a></p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullname = document.getElementById('fullname').value;
            const bloodgroup = document.getElementById('bloodgroup').value;
            const phone = document.getElementById('phone').value;
            const location = document.getElementById('location').value;
            const password = document.getElementById('password').value;
            const age = document.getElementById('age').value;
const gender = document.getElementById('gender').value;
const weight = document.getElementById('weight').value;
const medicalNote = document.getElementById('medicalNote').value;
            try {
                const res = await fetch('http://127.0.0.1:5000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullname, bloodgroup, phone, location, password, age, gender, weight, medicalNote })
                });
                const data = await res.json();
                if (res.ok) {
                    alert("Registration Successful!");
                    window.location.href = 'Login.html';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Error connecting to server!");
            }
        });
    </script>
</body>
</html>
