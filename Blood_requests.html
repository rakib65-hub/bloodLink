<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Blood Requests - BloodLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0f19; color: #fff; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(18, 24, 38, 0.9); border-bottom: 1px solid rgba(255, 0, 0, 0.2); }
        .logo { font-size: 24px; font-weight: 700; color: #ff3333; }
        nav { display: flex; align-items: center; gap: 25px; }
        nav a { color: #f1f5f9; text-decoration: none; font-weight: 500; transition: 0.3s; }
        nav a:hover, nav a.active { color: #ff3333; }
        .logout-btn { background: #ff3333; border: none; color: white; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .logout-btn:hover { background: #cc0000; }
        .container { padding: 40px 8%; }
        h2 { text-align: center; color: #ff3333; margin-bottom: 20px; }
        .filter-tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .tab-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .tab-btn.active { background: #ff3333; color: white; border-color: #ff3333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .card { background: #121826; border: 1px solid #1e293b; padding: 20px; border-radius: 10px; position: relative; }
        .card h3 { color: #ff3333; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .badge { background: #dc2626; color: white; padding: 3px 8px; font-size: 12px; border-radius: 4px; }
        .card p { color: #cbd5e1; font-size: 14px; margin: 5px 0; }
        .update-box { margin-top: 15px; padding-top: 10px; border-top: 1px solid #1e293b; display: flex; gap: 10px; align-items: center; }
        .update-box input { width: 80px; padding: 6px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 4px; text-align: center; }
        .update-btn { background: #16a34a; color: white; border: none; padding: 7px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .update-btn:hover { background: #15803d; }
        .no-data { text-align: center; color: #64748b; grid-column: 1/-1; font-size: 18px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">BloodLink🩸</div>
        <nav>
            <a href="user_home.html">Home</a>
            <a href="Find_a_donor.html">Find a Donor</a>
            <a href="Blood_requests.html" class="active" style="color: #ff3333;">Blood Requests</a>
            <a href="Request_blood.html">Request Blood</a>
            <a href="dashboard.html">Dashboard</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </nav>
    </header>

    <div class="container">
        <h2>Emergency Blood Requests</h2>
        
        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="tab-btn active" id="allBtn" onclick="switchTab('all')">All Active Requests</button>
            <button class="tab-btn" id="myBtn" onclick="switchTab('my')">My Requests</button>
        </div>

        <div id="requestsContainer" class="grid">
            <!-- Loaded dynamically -->
        </div>
    </div>

    <script>
        let currentMode = 'all';

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('allBtn').classList.toggle('active', mode === 'all');
            document.getElementById('myBtn').classList.toggle('active', mode === 'my');
            fetchRequests();
        }

        async function fetchRequests() {
            try {
                let url = 'http://localhost:5000/api/blood-requests';
                
                if (currentMode === 'my') {
                    const loggedDonor = JSON.parse(localStorage.getItem('loggedDonor'));
                    if (!loggedDonor || !loggedDonor.phone) {
                        alert("Please login first to view your requests!");
                        window.location.href = 'Login.html';
                        return;
                    }
                    url = `http://localhost:5000/api/my-blood-requests/${loggedDonor.phone}`;
                }

                const res = await fetch(url);
                const requests = await res.json();
                const container = document.getElementById('requestsContainer');
                container.innerHTML = "";

                if (requests.length === 0) {
                    container.innerHTML = "<p class='no-data'>No blood requests found.</p>";
                    return;
                }

                requests.forEach(req => {
                    container.innerHTML += `
                        <div class="card">
                            <h3>${req.bloodgroup} <span class="badge">${req.urgency}</span></h3>
                            <p><strong>Bags Needed:</strong> ${req.bagsNeeded} | <strong>Collected:</strong> <span style="color:#16a34a; font-weight:bold;">${req.bagsCollected}</span></p>
                            <p><strong>Hospital:</strong> ${req.hospital} (${req.department || 'N/A'})</p>
                            <p><strong>Location:</strong> ${req.location}</p>
                            <p><strong>Contact Person:</strong> ${req.contactPerson}</p>
                            <p><strong>Phone:</strong> <a href="tel:${req.phone}" style="color:#ff3333;">${req.phone}</a></p>
                            <p><strong>Summary:</strong> ${req.clinicalSummary}</p>
                            
                            <div class="update-box">
                                <span style="font-size:13px; color:#94a3b8;">Collected Bags:</span>
                                <input type="number" id="collected_${req._id}" value="${req.bagsCollected}" min="0" max="${req.bagsNeeded}">
                                <button class="update-btn" onclick="updateFulfillment('${req._id}')">Fulfill/Update</button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Error fetching requests:", err);
            }
        }

        async function updateFulfillment(id) {
            const bagsCollected = document.getElementById(`collected_${id}`).value;
            try {
                const res = await fetch(`http://localhost:5000/api/update-request/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bagsCollected })
                });
                const data = await res.json();
                if (res.ok) {
                    alert("Updated successfully!");
                    fetchRequests();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                console.error("Error updating:", err);
            }
        }

        function logout() {
            localStorage.removeItem('loggedDonor');
            window.location.href = 'Login.html';
        }

        fetchRequests();
    </script>
</body>
</html>
