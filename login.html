<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BloodLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-container { background: #121826; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid rgba(255, 51, 51, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ff3333; margin-bottom: 25px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
        input { width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: white; outline: none; }
        input:focus { border-color: #ff3333; }
        button { width: 100%; padding: 12px; background: #ff3333; border: none; border-radius: 6px; color: white; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #cc0000; }
        .back-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .back-link a { color: #ff3333; text-decoration: none; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Donor Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" id="phone" required placeholder="Enter your phone number">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit">Login</button>
        </form>
        <div class="back-link">
            <p>Don't have an account? <a href="donor_register.html">Register here</a></p>
            <p style="margin-top: 5px;"><a href="index.html">← Back to Home</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                const data = await res.json();
                if (res.ok) {
                    alert(data.message);
                    localStorage.setItem('loggedDonor', JSON.stringify(data.donor));
                    window.location.href = 'user_home.html';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Error connecting to server!");
            }
        });
    </script>
</body>
</html>
