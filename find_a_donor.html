<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Donor - BloodLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0f19; color: #fff; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(18, 24, 38, 0.9); border-bottom: 1px solid rgba(255, 0, 0, 0.2); }
        .logo { font-size: 24px; font-weight: 700; color: #ff3333; }
        nav { display: flex; align-items: center; gap: 25px; }
        nav a { color: #f1f5f9; text-decoration: none; font-weight: 500; transition: 0.3s; }
        nav a:hover, nav a.active { color: #ff3333; }
        .logout-btn { background: #ff3333; border: none; color: white; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .logout-btn:hover { background: #cc0000; }
        .container { padding: 50px 8%; }
        h2 { text-align: center; color: #ff3333; margin-bottom: 30px; }
        .search-box { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; }
        select, input { padding: 12px; background: #121826; border: 1px solid #334155; color: white; border-radius: 6px; outline: none; width: 220px; }
        select:focus, input:focus { border-color: #ff3333; }
        .search-btn { background: #ff3333; color: white; border: none; padding: 12px 25px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .search-btn:hover { background: #cc0000; }
        .clear-btn { background: #334155; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .clear-btn:hover { background: #475569; }
        .donor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .donor-card { background: #1e293b; border: 1px solid rgba(255, 51, 51, 0.2); padding: 20px; border-radius: 10px; width: 280px; display: flex; flex-direction: column; align-items: center; text-align: left; }
        .donor-card h3 { color: #ff3333; margin-bottom: 8px; text-align: center; } 
        .donor-card p { color: #cbd5e1; font-size: 14px; margin: 4px 0; width: 100%; }
        .donor-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #ff3333; margin-bottom: 12px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">BloodLink🩸</div>
        <nav id="navbar"></nav>
    </header>

    <div class="container">
        <h2>Search Available Donors</h2>
        <div class="search-box">
            <select id="searchBlood">
                <option value="">All Blood Groups</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
            <input type="text" id="searchLocation" placeholder="Filter by Location...">
            <button class="search-btn" onclick="filterDonors()">Search</button>
            <button class="clear-btn" onclick="clearSearch()">Clear</button>
        </div>

        <div id="allDonorsContainer" class="donor-grid"></div>
    </div>

    <script>
        const loggedDonor = JSON.parse(localStorage.getItem('loggedDonor'));
        const nav = document.getElementById('navbar');

        if (loggedDonor) {
            nav.innerHTML = `
                <a href="user_home.html">Home</a>
                <a href="find_a_donor.html" class="active" style="color: #ff3333;">Find a Donor</a>
                <a href="blood_requests.html">Blood Requests</a>
                <a href="request_blood.html">Request Blood</a>
                <a href="dashboard.html">Dashboard</a>
                <button class="logout-btn" onclick="logout()">Logout</button>
            `;
        } else {
            nav.innerHTML = `
                <a href="index.html">Home</a>
                <a href="find_a_donor.html" class="active" style="color: #ff3333;">Find a Donor</a>
                <a href="blood_requests.html">Blood Requests</a>
                <a href="donor_register.html">Register as a Donor</a>
                <a href="login.html" style="background: #ff3333; padding: 8px 15px; border-radius: 5px; color: white;">Login</a>
            `;
        }

        function logout() {
            localStorage.removeItem('loggedDonor');
            window.location.href = 'login.html';
        }

        let allDonors = [];

        async function fetchDonors() {
            try {
                const res = await fetch('/api/donors');
                allDonors = await res.json();
                displayDonors(allDonors);
            } catch (err) {
                console.log("Error loading donors", err);
            }
        }

        function displayDonors(donors) {
            const container = document.getElementById('allDonorsContainer');
            container.innerHTML = "";
            if (donors.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#64748b; grid-column:1/-1;'>Kono donor paoa jayni.</p>";
                return;
            }
            donors.forEach(donor => {
                container.innerHTML += `    
                    <div class="donor-card">
                        <img src="${donor.profilePic || 'https://via.placeholder.com/80'}" alt="Profile Pic" class="donor-img">
                        <h3>${donor.fullname}</h3>
                        <p><strong>Blood Group:</strong> <span style="color: #ff3333;">${donor.bloodgroup}</span></p>
                        <p><strong>Location:</strong> ${donor.location}</p>
                        <p><strong>Phone:</strong> ${donor.phone}</p>
                        <p><strong>Age:</strong> ${donor.age || 'N/A'}</p>
                        <p><strong>Gender:</strong> ${donor.gender || 'N/A'}</p>
                        <p><strong>Weight:</strong> ${donor.weight || 'N/A'}</p>
                        <p><strong>Medical Note:</strong> ${donor.medicalNote || 'None'}</p>
                    </div>
                `;
            });
        }

        function filterDonors() {
            const blood = document.getElementById('searchBlood').value.trim();
            const location = document.getElementById('searchLocation').value.toLowerCase().trim();

            const filtered = allDonors.filter(donor => {
                const matchBlood = (blood === "" || donor.bloodgroup === blood);
                const matchLocation = donor.location.toLowerCase().includes(location);
                return matchBlood && matchLocation;
            });
            displayDonors(filtered);
        }

        function clearSearch() {
            document.getElementById('searchBlood').value = "";
            document.getElementById('searchLocation').value = "";
            displayDonors(allDonors);
        }

        fetchDonors();
    </script>
</body>
</html>
