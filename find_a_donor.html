<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Donor - BloodLink LifeShare</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0f19; color: #fff; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(18, 24, 38, 0.95); border-bottom: 1px solid rgba(239, 68, 68, 0.3); }
        .logo { font-size: 24px; font-weight: 700; color: #ef4444; }
        nav { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        nav a { color: #f1f5f9; text-decoration: none; font-weight: 500; transition: 0.3s; font-size: 15px; }
        nav a:hover, nav a.active { color: #ef4444; }
        .logout-btn { background: #ef4444; border: none; color: white; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .logout-btn:hover { background: #dc2626; }
        
        .container { padding: 40px 8%; max-width: 1400px; margin: 0 auto; }
        h2 { text-align: center; color: #ef4444; margin-bottom: 25px; font-size: 32px; }
        
        .search-box { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; }
        select, input { padding: 12px 18px; background: #121826; border: 1px solid #334155; color: white; border-radius: 8px; outline: none; width: 240px; font-size: 14px; }
        select:focus, input:focus { border-color: #ef4444; }
        .search-btn { background: #ef4444; color: white; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .search-btn:hover { background: #dc2626; }
        .clear-btn { background: #334155; color: white; border: none; padding: 12px 22px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .clear-btn:hover { background: #475569; }
        
        .donor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .donor-card { background: #121826; border: 1px solid #1e293b; border-top: 4px solid #ef4444; padding: 24px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: 0.3s; }
        .donor-card:hover { transform: translateY(-4px); border-color: #ef4444; }
        .donor-card h3 { color: #ef4444; margin-bottom: 8px; font-size: 20px; }
        .donor-card p { color: #cbd5e1; font-size: 14px; margin: 5px 0; width: 100%; text-align: left; }
        .donor-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #ef4444; margin-bottom: 15px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🩸 BloodLink</div>
        <nav id="navbar"></nav>
    </header>

    <div class="container">
        <h2>Search Available Donors</h2>
        <div class="search-box">
            <select id="searchBlood">
                <option value="">All Blood Groups</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
            <input type="text" id="searchLocation" placeholder="Filter by Location (e.g. Uttara)...">
            <button class="search-btn" onclick="filterDonors()">Search</button>
            <button class="clear-btn" onclick="clearSearch()">Clear</button>
        </div>

        <div id="allDonorsContainer" class="donor-grid"></div>
    </div>

    <script>
        const loggedDonor = JSON.parse(localStorage.getItem('loggedDonor'));
        const nav = document.getElementById('navbar');

        if (loggedDonor) {
            nav.innerHTML = `
                <a href="user_home.html">Home</a>
                <a href="find_a_donor.html" class="active">Find a Donor</a>
                <a href="blood_requests.html">Blood Requests</a>
                <a href="request_blood.html">Request Blood</a>
                <a href="dashboard.html">Dashboard</a>
                <button class="logout-btn" onclick="logout()">Logout</button>
            `;
        } else {
            nav.innerHTML = `
                <a href="index.html">Home</a>
                <a href="find_a_donor.html" class="active">Find a Donor</a>
                <a href="blood_requests.html">Blood Requests</a>
                <a href="donor_register.html">Register</a>
                <a href="login.html" style="background: #ef4444; padding: 8px 18px; border-radius: 6px; color: white; font-weight:600;">Login</a>
            `;
        }

        function logout() {
            localStorage.removeItem('loggedDonor');
            window.location.href = 'login.html';
        }

        let allDonors = [];

        async function fetchDonors() {
            try {
                const res = await fetch('/api/donors');
                allDonors = await res.json();
                displayDonors(allDonors);
            } catch (err) {
                console.log("Error loading donors", err);
            }
        }

        function displayDonors(donors) {
            const container = document.getElementById('allDonorsContainer');
            container.innerHTML = "";
            if (donors.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#64748b; grid-column:1/-1; padding:40px;'>Kono donor paoa jayni.</p>";
                return;
            }
            donors.forEach(donor => {
                container.innerHTML += `    
                    <div class="donor-card">
                        <img src="${donor.profilePic || 'https://via.placeholder.com/90'}" alt="Profile Pic" class="donor-img">
                        <h3>${donor.fullname}</h3>
                        <p><strong>Blood Group:</strong> <span style="color: #ef4444; font-weight:bold;">${donor.bloodgroup}</span></p>
                        <p><strong>Location:</strong> ${donor.location}</p>
                        <p><strong>Phone:</strong> <a href="tel:${donor.phone}" style="color:#ef4444;">${donor.phone}</a></p>
                        <p><strong>Age:</strong> ${donor.age || 'N/A'}</p>
                        <p><strong>Gender:</strong> ${donor.gender || 'N/A'}</p>
                        <p><strong>Weight:</strong> ${donor.weight || 'N/A'}</p>
                        <p><strong>Medical Note:</strong> ${donor.medicalNote || 'None'}</p>
                    </div>
                `;
            });
        }

        function filterDonors() {
            const blood = document.getElementById('searchBlood').value.trim();
            const location = document.getElementById('searchLocation').value.toLowerCase().trim();

            const filtered = allDonors.filter(donor => {
                const matchBlood = (blood === "" || donor.bloodgroup === blood);
                const matchLocation = donor.location.toLowerCase().includes(location);
                return matchBlood && matchLocation;
            });
            displayDonors(filtered);
        }

        function clearSearch() {
            document.getElementById('searchBlood').value = "";
            document.getElementById('searchLocation').value = "";
            displayDonors(allDonors);
        }

        fetchDonors();
    </script>
</body>
</html>
