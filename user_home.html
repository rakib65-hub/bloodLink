<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Home - BloodLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0f19; color: #fff; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(18, 24, 38, 0.95); border-bottom: 1px solid rgba(239, 68, 68, 0.3); }
        .logo { font-size: 24px; font-weight: 700; color: #ef4444; }
        nav { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        nav a { color: #f1f5f9; text-decoration: none; font-weight: 500; transition: 0.3s; font-size: 15px; }
        nav a:hover, nav a.active { color: #ef4444; }
        .logout-btn { background: #ef4444; border: none; color: white; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .logout-btn:hover { background: #dc2626; }
        
        .container { padding: 40px 8%; max-width: 1400px; margin: 0 auto; }
        h2 { color: #ef4444; margin-bottom: 20px; font-size: 32px; }
        .welcome-card { background: #121826; border: 1px solid #1e293b; padding: 30px; border-radius: 12px; margin-bottom: 30px; }
        .welcome-card h3 { color: #ef4444; margin-bottom: 10px; font-size: 24px; }
        .welcome-card p { color: #cbd5e1; font-size: 15px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🩸 BloodLink</div>
        <nav>
            <a href="user_home.html" class="active">Home</a>
            <a href="find_a_donor.html">Find a Donor</a>
            <a href="blood_requests.html">Blood Requests</a>
            <a href="request_blood.html">Request Blood</a>
            <a href="dashboard.html">Dashboard</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </nav>
    </header>

    <div class="container">
        <div class="welcome-card">
            <h3 id="welcomeTitle">Welcome Back!</h3>
            <p>You are successfully logged into the BloodLink network. Use the menu above to search for donors, manage your blood requests, or request emergency blood.</p>
        </div>
    </div>

    <script>
        const loggedDonor = JSON.parse(localStorage.getItem('loggedDonor'));
        if (loggedDonor && loggedDonor.fullname) {
            document.getElementById('welcomeTitle').innerText = `Welcome Back, ${loggedDonor.fullname}!`;
        }

        function logout() {
            localStorage.removeItem('loggedDonor');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
