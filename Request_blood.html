<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Blood - BloodLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0f19; color: #fff; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(18, 24, 38, 0.9); border-bottom: 1px solid rgba(255, 0, 0, 0.2); }
        .logo { font-size: 24px; font-weight: 700; color: #ff3333; }
        nav { display: flex; align-items: center; gap: 25px; }
        nav a { color: #f1f5f9; text-decoration: none; font-weight: 500; transition: 0.3s; }
        nav a:hover, nav a.active { color: #ff3333; }
        .logout-btn { background: #ff3333; border: none; color: white; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .logout-btn:hover { background: #cc0000; }
        .container { max-width: 700px; margin: 40px auto; background: #121826; padding: 30px; border-radius: 12px; border: 1px solid #1e293b; }
        h2 { text-align: center; color: #ff3333; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #ff3333; }
        .submit-btn { width: 100%; background: #ff3333; color: white; border: none; padding: 14px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 16px; }
        .submit-btn:hover { background: #cc0000; }
    </style>
</head>
<body>

    <header>
        <div class="logo">BloodLink🩸</div>
        <nav>
            <a href="user_home.html">Home</a>
            <a href="Find_a_donor.html">Find a Donor</a>
            <a href="Blood_requests.html">Blood Requests</a>
            <a href="Request_blood.html" class="active" style="color: #ff3333;">Request Blood</a>
            <a href="dashboard.html">Dashboard</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </nav>
    </header>

    <div class="container">
        <h2>Emergency Blood Request Form</h2>
        <form id="bloodRequestForm">
            <div class="form-group">
                <label>Required Blood Group</label>
                <select id="bloodgroup" required>
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>
            <div class="form-group">
                <label>Urgency Priority</label>
                <select id="urgency" required>
                    <option value="Critical">Critical</option>
                    <option value="Urgent">Urgent</option>
                    <option value="Standard">Standard</option>
                </select>
            </div>
            <div class="form-group">
                <label>Number of Blood Bags Required</label>
                <input type="number" id="bagsNeeded" min="1" required placeholder="e.g., 2">
            </div>
            <div class="form-group">
                <label>Hospital / Medical Center Name</label>
                <input type="text" id="hospital" required placeholder="Hospital name">
            </div>
            <div class="form-group">
                <label>Department / Unit</label>
                <input type="text" id="department" placeholder="e.g., ICU, Cardiology">
            </div>
            <div class="form-group">
                <label>Location (Area, City)</label>
                <input type="text" id="location" required placeholder="e.g., Uttara, Dhaka">
            </div>
            <div class="form-group">
                <label>Emergency Phone Number</label>
                <input type="text" id="phone" required placeholder="Phone number">
            </div>
            <div class="form-group">
                <label>Contact Person Name</label>
                <input type="text" id="contactPerson" required placeholder="Your name">
            </div>
            <div class="form-group">
                <label>Requirement Reason / Clinical Summary</label>
                <textarea id="clinicalSummary" rows="4" required placeholder="Write brief clinical details..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Submit Blood Request</button>
        </form>
    </div>

    <script>
        const loggedInDonor = JSON.parse(localStorage.getItem('loggedDonor'));
        if (loggedInDonor) {
            if(document.getElementById('phone')) document.getElementById('phone').value = loggedInDonor.phone || '';
            if(document.getElementById('contactPerson')) document.getElementById('contactPerson').value = loggedInDonor.fullname || '';
        } else {
            window.location.href = 'Login.html';
        }

        document.getElementById('bloodRequestForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const requestData = {
                bloodgroup: document.getElementById('bloodgroup').value,
                urgency: document.getElementById('urgency').value,
                bagsNeeded: document.getElementById('bagsNeeded').value,
                hospital: document.getElementById('hospital').value,
                department: document.getElementById('department').value,
                location: document.getElementById('location').value,
                phone: document.getElementById('phone').value,
                contactPerson: document.getElementById('contactPerson').value,
                clinicalSummary: document.getElementById('clinicalSummary').value
            };

            try {
                const response = await fetch('http://localhost:5000/api/request-blood', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });
                const data = await response.json();
                if (response.ok) {
                    alert("Blood request posted successfully!");
                    window.location.href = 'Blood_requests.html';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                console.error("Error:", err);
                alert("Something went wrong!");
            }
        });

        function logout() {
            localStorage.removeItem('loggedDonor');
            window.location.href = 'Login.html';
        }
    </script>
</body>
</html>
